# gitleaks configuration: the default rules, plus allowlists for findings
# that are not secrets. Each allowlist names the exact files and only the
# rules that fire there, so anything else in those files is still reported.

[extend]
useDefault = true

[[allowlists]]
description = "Editor agent instructions: curl examples with the default admin:admin login of the local development container."
targetRules = ["curl-auth-user"]
paths = [
  '''(^|/)\.cursor/rules/global\.mdc$''',
]

[[allowlists]]
description = "Editor agent instructions: curl examples with the default admin:admin login of the local development container."
targetRules = ["curl-auth-user"]
paths = [
  '''(^|/)\.cursorrules$''',
]

[[allowlists]]
description = "Bug-fix notes: curl examples with Basic auth for admin:admin (base64) on the local development container."
targetRules = ["curl-auth-header"]
paths = [
  '''(^|/)BUG_FIX_ORGANISATION_USER_ASSIGNMENT\.md$''',
]

[[allowlists]]
description = "README example: curl with the default admin:admin login of the local development container."
targetRules = ["curl-auth-user"]
paths = [
  '''(^|/)README\.md$''',
]

[[allowlists]]
description = "Documentation and testing guides: curl examples with the default admin:admin login of the local development container."
targetRules = ["curl-auth-user"]
paths = [
  '''(^|/)docs/ANONYMOUS_USER_REGISTRATION_USECASE\.md$''',
  '''(^|/)docs/API_TESTING\.md$''',
  '''(^|/)docs/ARCHIMATE_QUICK_TEST\.md$''',
  '''(^|/)docs/ARCHIMATE_TESTING_GUIDE\.md$''',
  '''(^|/)docs/ARCHITECTURE\.md$''',
  '''(^|/)docs/Installation/demo\-environment\.md$''',
  '''(^|/)docs/TESTING_ORGANIZATION_SYNC\.md$''',
]

[[allowlists]]
description = "E2E seed script: curl login built from the ADMIN_USER/ADMIN_PASSWORD environment variables, not a literal."
targetRules = ["curl-auth-user"]
paths = [
  '''(^|/)tests/e2e/ci\-seed\.sh$''',
]
