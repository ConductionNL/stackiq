publiccodeYmlVersion: "0.4"

name: Stackiq
url: "https://github.com/ConductionNL/stackiq"
landingURL: "https://stackiq.conduction.nl"
softwareVersion: "0.2.2"
releaseDate: "2026-05-26"
developmentStatus: stable
softwareType: "standalone/other"
logo: img/app-store.svg

platforms:
  - web

categories:
  - it-asset-management
  - knowledge-management

intendedAudience:
  countries:
    - nl
  scope:
    - government

dependsOn:
  open:
    - name: Nextcloud
      versionMin: "32"
      versionMax: "35"
    - name: OpenRegister

description:
  en:
    shortDescription: >
      Software catalog and IT asset registry for Nextcloud.
    longDescription: >
      Software Catalogs provides a centralised registry for managing software assets,
      applications, and IT components within Nextcloud. It enables organisations to
      catalogue their software landscape, track licenses, and maintain an overview of
      deployed applications. Built on Open Register, it integrates with Nextcloud's
      collaboration ecosystem and supports Dutch government software inventory
      requirements.
      Conduction maintains this component within the Nextcloud ISV programme.
      Install it from the Nextcloud App Store at https://apps.nextcloud.com/apps/stackiq.
    features:
      - Register the applications in your organisation's IT landscape
      - Track modules with their versions, suppliers and dependencies
      - Map connections between applications and modules
      - Link contracts and licence agreements to applications
      - Manage organisations and their contact persons
      - Create Nextcloud accounts from contact persons in OpenRegister
      - Assign groups automatically by role
      - Share and synchronise catalogue data over a federated network
      - Publish your software catalogue as open data
      - Synchronise organisation contacts in the background
    screenshots:
      - img/screenshot-dashboard.png
      - img/screenshot-applications.png
      - img/screenshot-connections.png

  nl:
    shortDescription: >
      Softwarecatalogus en IT-activaregistratie voor Nextcloud.
    longDescription: >
      Software Catalogs biedt een gecentraliseerd register voor het beheren van
      softwareactiva, applicaties en IT-componenten binnen Nextcloud. Het stelt
      organisaties in staat hun softwarelandschap te catalogiseren, licenties bij
      te houden en een overzicht te bewaren van geïmplementeerde applicaties.
      Gebouwd op Open Register integreert het met het Nextcloud-ecosysteem en
      ondersteunt de vereisten voor softwareinventarisatie van de Nederlandse overheid.
      Conduction onderhoudt dit component binnen het Nextcloud ISV-programma.
      Installeer het vanuit de Nextcloud App Store op https://apps.nextcloud.com/apps/stackiq.
    features:
      - Applicaties in het IT-landschap van uw organisatie registreren
      - Modules bijhouden met hun versies, leveranciers en afhankelijkheden
      - Koppelingen tussen applicaties en modules vastleggen
      - Contracten en licentieafspraken aan applicaties koppelen
      - Organisaties en hun contactpersonen beheren
      - Nextcloud-accounts aanmaken vanuit contactpersonen in OpenRegister
      - Groepen automatisch toewijzen op basis van rol
      - Catalogusgegevens delen en synchroniseren via een gefedereerd netwerk
      - Uw softwarecatalogus publiceren als open data
      - Organisatiecontacten op de achtergrond synchroniseren
    screenshots:
      - img/screenshot-dashboard.png
      - img/screenshot-applications.png
      - img/screenshot-connections.png

