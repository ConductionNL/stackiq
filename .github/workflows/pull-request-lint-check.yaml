name: Lint Check

on:
  pull_request:
    branches:
      - development
      - main

jobs:
  lint-check:
    runs-on: ubuntu-latest
    # Observed max 1.4 min across 176 fleet runs; 15 leaves ample headroom.
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Install dependencies
        run: npm i

      - name: Linting
        run: npm run lint
