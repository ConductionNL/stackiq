name: Publish docs

# Docs deploy ONLY from the dedicated `documentation` branch — decoupled from main/development
# so doc edits never trigger releases and code releases never trigger doc builds. No cron.
on:
  push:
    branches: [documentation]
  pull_request:
    branches: [documentation]
  workflow_dispatch:

jobs:
  build:
    uses: Conduction/.github/.forgejo/workflows/documentation-build.yml@main
    with:
      source-folder: docs
    secrets: inherit

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    uses: Conduction/.github/.forgejo/workflows/documentation-deploy.yml@main
    with:
      # FROZEN through the softwarecatalog -> stackiq app-id rename.
      # This names an EXISTING Cloudflare Pages project. Renaming it here does
      # not rename the project — the deploy simply targets a project that does
      # not exist, and a Pages deploy against an unknown project reports success
      # while reaching nobody (see the two green Cloudflare deploys that shipped
      # to nothing during the fleet rename). Rename the Cloudflare project first,
      # then this line.
      cf-project-name: softwarecatalog-docs
    secrets: inherit
