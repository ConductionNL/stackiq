# app-tests-live.yml — stackiq caller for the LIVE-NC reusable workflow.
#
# Boots a real, seeded Nextcloud (db + NC + openregister deployed/enabled +
# stackiq deployed/enabled), then runs the deep Playwright e2e
# (tests/e2e/workflows/) and/or the Newman API-contract suite against it as
# HARD gates. Generalised per GAP-2 (arm CI live-gating) from openregister's
# reference rig; the reusable tests-live.yml is byte-identical fleet-wide, only
# these inputs differ. Additive — does not touch app-tests.yml / release /
# pre-merge workflows.
#
# Gate status for stackiq (see TESTING-CI-ROLLOUT.md for the evidence table):
#   deep-e2e: true  — e2e RESOLVES register+schema at runtime from /api/voorzieningen/config — CI-portable
#   newman:   true   — ARMED: the collection "0. Setup / Preflight" request resolves the register
#                     numeric id from the stable slug 'voorzieningen' (and addresses the org/contact/
#                     module/contract/dienst/gebruik schemas by slug), so the suite survives a fresh
#                     CI boot. AMEF ArchiMate export is un-quarantined (the InitializeSettings repair
#                     step auto-configures the AMEF register -> exportOrgArchiMate returns 200 model
#                     XML); the no-standalone-'standaard'-schema case stays a deterministic 404.

name: app-tests-live

on:
  pull_request:
    branches:
      - development
      - main
      - beta
  push:
    branches:
      - development
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    uses: ./.forgejo/workflows/tests-live.yml
    with:
      app-id: stackiq
      is-openregister: false
      run-e2e: true
      run-newman: true
      newman-entrypoint: tests/integration/run-newman.sh
